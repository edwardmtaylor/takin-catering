<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Order received · Takin Catering</title><link rel="stylesheet" href="styles.css"></head>
<body class="success-page"><main class="success-card"><div class="success-icon">✓</div><p class="eyebrow">Payment received</p><h1>Thank you — your catering order is in.</h1><p id="statusText">We’re securely confirming your Stripe payment. Takin Catering will review your event details and contact you to confirm the final catering plan.</p><a class="btn primary" href="/">Back to Takin Catering</a><p class="micro">Keep your Stripe receipt for your records.</p></main><script>
(async()=>{const id=new URLSearchParams(location.search).get('session_id');if(!id)return;try{const r=await fetch('/api/session-status?session_id='+encodeURIComponent(id));const d=await r.json();if(d.payment_status==='paid')document.getElementById('statusText').textContent='Your payment has been confirmed. Takin Catering will review your event details and contact you to confirm the final catering plan.';}catch(e){}})();
</script></body></html>
